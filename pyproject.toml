[project]
name = "cashflow-guardian-2026"
version = "0.1.0"
description = "SPECIFY- Hackronyx 2.0 Ray 2026 Hacakthon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "pandas>=3.0.6",
    "psycopg2>=2.9.13",
    "uvicorn>=0.54.0",
    "firebase-admin>=6.5.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.32",
    "xlrd>=2.0.1",
]

[tool.pyright]
include = ["main.py", "backend", "db"]
exclude = ["src", "node_modules", "dist", ".venv"]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
executionEnvironments = [
    { root = "." }
]

